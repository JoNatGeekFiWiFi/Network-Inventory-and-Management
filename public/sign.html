<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<!-- The token lives in the URL fragment, which browsers do not send to the server and which stays
     out of server logs and Referer headers. The page reads it and POSTs it in a request body. -->
<title>Sign a document</title>
<link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.css" />
<style>
  :root{ --bg:#f6f6f4; --surface:#fff; --surface2:#f1efe8; --text:#1f1f1d; --text2:#5f5e5a;
         --text3:#8a8980; --border:rgba(0,0,0,.14); --accent:#185fa5; --danger:#b03030; --ok:#2f7a44; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1a18; --surface:#242422; --surface2:#2c2c2a; --text:#f1f1ef; --text2:#b4b2a9;
           --text3:#888780; --border:rgba(255,255,255,.16); --accent:#85b7eb; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--text2);font-size:13px}
  .doc{background:var(--surface2);border-radius:8px;padding:18px;white-space:pre-wrap;
       font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:52vh;overflow:auto}
  .btn{font:inherit;font-size:15px;padding:11px 18px;border-radius:9px;border:.5px solid var(--border);
       background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.primary[disabled]{opacity:.45;cursor:not-allowed}
  .btn.link{background:none;border:none;color:var(--text2);text-decoration:underline;padding:6px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px}
  input[type=text]{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:8px;
                   border:.5px solid var(--border);background:var(--surface);color:var(--text)}
  .consent{display:flex;gap:11px;align-items:flex-start;background:var(--surface2);padding:14px;border-radius:9px}
  .consent input{margin-top:3px;width:19px;height:19px;flex:none}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{padding:8px 15px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px}
  .tab[aria-selected=true]{background:var(--accent);color:#fff;border-color:transparent}
  canvas{width:100%;height:190px;border:1.5px dashed var(--border);border-radius:9px;background:var(--surface);touch-action:none;display:block}
  .typed-preview{border:1.5px dashed var(--border);border-radius:9px;padding:20px;min-height:76px;
                 font:30px/1.2 "Times New Roman",Times,serif;font-style:italic;color:#12306b}
  @media (prefers-color-scheme: dark){ .typed-preview{color:#9dc4f0} }
  .note{font-size:12.5px;color:var(--text3);margin-top:9px}
  .banner{padding:13px 15px;border-radius:9px;margin-bottom:16px;font-size:14px}
  .banner.ok{background:rgba(47,122,68,.13);color:var(--ok)}
  .banner.warn{background:rgba(176,48,48,.11);color:var(--danger)}
  .hash{font:11px ui-monospace,monospace;color:var(--text3);word-break:break-all}
  .hidden{display:none}
  /* The W-9 form. Plain inputs, large enough to use on a phone. */
  .f{margin-bottom:14px}
  .f input[type=text],.f select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:8px;
     border:.5px solid var(--border);background:var(--surface);color:var(--text)}
  .f .err{color:var(--danger);font-size:13px;margin-top:4px}
  .f.bad input,.f.bad select{border-color:var(--danger)}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
  .opt{display:flex;gap:8px;align-items:center;padding:8px 10px;border:.5px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text);font-size:14px;margin:0}
  .opt input{margin:0;width:17px;height:17px;flex:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.grid2{grid-template-columns:1fr}}
  .cert{background:var(--surface2);border-radius:8px;padding:14px;font-size:13.5px}
  .cert p{margin:0 0 7px}
  .cert .x{text-decoration:line-through;opacity:.6}
  details summary{cursor:pointer;color:var(--text2);font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="card"><div id="boot">Loading the document…</div></div>
</div>

<script>
// Deliberately dependency-free and self-contained. This page is opened by people who are not our
// users, on unknown devices, often once. It should render with nothing but this file.
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const token = location.hash.slice(1);
let doc = null, strokes = [], mode = 'drawn';

async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ token }, body || {}))
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(j.error || 'Something went wrong'); err.fields = j.fields; throw err; }
  return j;
}

function fail(message) {
  $('#wrap').innerHTML = '<div class="card"><h1>This link cannot be opened</h1>' +
    '<p class="sub">' + esc(message) + '</p>' +
    '<p class="sub">If you still need to sign, reply to the message that brought you here and we will send a new link.</p></div>';
}

async function boot() {
  if (!token) return fail('The link is incomplete — it may have been cut short by your email client. Try opening it from the original message.');
  try { doc = await api('/api/sign/open'); } catch (e) { return fail(e.message); }
  render();
}

function render() {
  const signed = doc.already_signed;
  const blocked = !doc.can_sign && !signed;

  let banner = '';
  if (signed) banner = '<div class="banner ok"><i class="ti ti-check"></i> You signed this document. A copy is below.</div>';
  else if (doc.declined) banner = '<div class="banner warn">You declined this document.</div>';
  else if (blocked && doc.waiting_for.length) banner = '<div class="banner warn">This document is waiting on ' + esc(doc.waiting_for.join(', ')) + ' before it reaches you. You will get another message when it is your turn.</div>';

  $('#wrap').innerHTML = `
    ${banner}
    <div class="card">
      <h1>${esc(doc.title)}</h1>
      <div class="sub">From ${esc(doc.company)} · for ${esc(doc.signer.role_label)} ${esc(doc.signer.name)}</div>
    </div>

    ${doc.form && !signed && !doc.declined && !blocked ? w9Block() : ''}

    <div class="card">
      <label>${doc.form ? 'The form as sent to you' : 'The document'}</label>
      ${doc.form ? '<div class="sub">The official IRS form. Your answers above are written onto it when you sign.</div>' : `<div class="doc">${esc(doc.body)}</div>`}
      <div class="row" style="margin-top:12px">
        <a class="btn" href="/api/sign/pdf?token=${encodeURIComponent(token)}" target="_blank" rel="noopener">
          <i class="ti ti-download"></i> Open as PDF</a>
      </div>
      <div class="note">Document fingerprint (SHA-256), so this copy can be proven identical later:</div>
      <div class="hash">${esc(doc.sha256 || '')}</div>
    </div>

    ${doc.others.length ? `<div class="card"><label>Other signers</label>${
      doc.others.map(o => `<div class="sub">${esc(o.role_label)} — ${esc(o.name)} · ${esc(o.status)}</div>`).join('')
    }</div>` : ''}

    ${signed || doc.declined || blocked ? '' : signBlock()}
  `;
  if (!signed && !doc.declined && !blocked) { wireSigning(); if (doc.form) wireW9(); }
}

// ---- Form W-9 ---------------------------------------------------------------------------------------
//
// Your taxpayer ID number is sent only when you preview or sign, goes straight onto the form, and is
// not stored anywhere else by the company that asked for it.
function w9Block() {
  const f = doc.form, p = f.prefill || {};
  const field = (id, label, value, opts = {}) => `<div class="f" id="f-${id}">
      <label for="w9-${id}">${label}</label>
      <input type="text" id="w9-${id}" value="${esc(value || '')}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ''}
        ${opts.max ? `maxlength="${opts.max}"` : ''} ${opts.mode ? `inputmode="${opts.mode}"` : ''} autocomplete="${opts.ac || 'off'}"/>
      ${opts.help ? `<div class="note" style="margin-top:4px">${opts.help}</div>` : ''}<div class="err"></div></div>`;
  return `<div class="card" id="w9">
    <h1 style="font-size:18px">Form W-9</h1>
    <div class="sub" style="margin-bottom:14px">Request for Taxpayer Identification Number and Certification (Rev. ${esc(f.revision)}). ${Object.keys(p).length ? 'We filled in what we already had — please check it.' : ''}</div>

    ${field('name', '1. Name of entity or individual (as shown on your income tax return)', p.name, { ac: 'name', help: 'A sole proprietor or single-member LLC enters the owner\'s name here and the business name on line 2.' })}
    ${field('business_name', '2. Business name / disregarded entity name, if different', p.business_name, { ac: 'organization' })}

    <div class="f" id="f-classification"><label>3a. Federal tax classification — choose one</label>
      <div class="opts">${f.classifications.map(([k, l]) => `<label class="opt"><input type="radio" name="cls" value="${k}" ${p.classification === k ? 'checked' : ''}/> ${esc(l)}</label>`).join('')}</div>
      <div class="err"></div></div>
    <div class="f ${p.classification === 'llc' ? '' : 'hidden'}" id="f-llc_class"><label for="w9-llc_class">LLC tax classification</label>
      <select id="w9-llc_class"><option value="">Choose…</option>
        <option value="C" ${p.llc_class === 'C' ? 'selected' : ''}>C — C corporation</option>
        <option value="S" ${p.llc_class === 'S' ? 'selected' : ''}>S — S corporation</option>
        <option value="P" ${p.llc_class === 'P' ? 'selected' : ''}>P — Partnership</option></select>
      <div class="note" style="margin-top:4px">A single-member LLC that is a disregarded entity should choose the owner's classification above instead.</div><div class="err"></div></div>
    <div class="${p.classification === 'other' ? '' : 'hidden'}" id="wrap-other">${field('other_text', 'Other — describe', p.other_text)}</div>
    <div class="f"><label class="opt" style="display:flex"><input type="checkbox" id="w9-foreign"/> 3b. I checked Partnership, Trust/estate, or LLC-P above and have foreign partners, owners or beneficiaries</label></div>

    <details style="margin-bottom:14px"><summary>4. Exemptions — most people leave these blank</summary>
      <div class="grid2" style="margin-top:10px">${field('exempt_payee', 'Exempt payee code (1–13)', p.exempt_payee, { max: 2, mode: 'numeric' })}${field('fatca_code', 'FATCA exemption code (A–M)', p.fatca_code, { max: 1 })}</div></details>

    ${field('address', '5. Address (number, street, and apt. or suite no.)', p.address, { ac: 'street-address' })}
    ${field('city_state_zip', '6. City, state, and ZIP code', p.city_state_zip, { ac: 'off', ph: 'Phoenix, AZ 85001' })}
    ${field('account_numbers', '7. Account number(s) — optional', p.account_numbers)}

    <div class="f" id="f-tin_type"><label>Part I — Taxpayer Identification Number</label>
      <div class="opts" style="grid-template-columns:1fr 1fr">
        <label class="opt"><input type="radio" name="tintype" value="ssn"/> Social Security number</label>
        <label class="opt"><input type="radio" name="tintype" value="ein"/> Employer ID number (EIN)</label></div><div class="err"></div></div>
    <div class="f" id="f-tin"><label for="w9-tin">Number</label>
      <input type="text" id="w9-tin" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="9 digits" spellcheck="false"/>
      <div class="note" style="margin-top:4px">Must match the name on line 1. It goes onto the form only — it is not saved anywhere else.</div><div class="err"></div></div>

    <div class="f"><label>Part II — Certification</label>
      <div class="cert" id="certText">${f.certification.map((t, i) => `<p id="cert-${i}">${esc(t)}</p>`).join('')}</div>
      <label class="opt" style="display:flex;margin-top:8px"><input type="checkbox" id="w9-bw"/> The IRS has notified me that I am currently subject to backup withholding (this crosses out item 2)</label>
      <div class="note">${esc(f.certification_note)}</div></div>

    <div class="row"><button class="btn" id="previewBtn" onclick="previewW9()"><i class="ti ti-eye"></i> Preview the completed form</button>
      <span class="note" style="margin:0">Opens the filled-in W-9 so you can check it before signing.</span></div>
  </div>`;
}
function wireW9() {
  document.querySelectorAll('input[name=cls]').forEach(r => r.addEventListener('change', () => {
    const v = w9Value('cls');
    $('#f-llc_class').classList.toggle('hidden', v !== 'llc');
    $('#wrap-other').classList.toggle('hidden', v !== 'other');
  }));
  $('#w9-bw').addEventListener('change', () => { const p = $('#cert-2'); if (p) p.classList.toggle('x', $('#w9-bw').checked); });
  const tin = $('#w9-tin');
  // Format as it is typed, in the shape the chosen number takes: 123-45-6789 or 12-3456789.
  const fmt = () => {
    const d = tin.value.replace(/\D/g, '').slice(0, 9);
    const t = w9Value('tintype');
    tin.value = t === 'ein' ? (d.length > 2 ? d.slice(0, 2) + '-' + d.slice(2) : d)
      : (d.length > 5 ? d.slice(0, 3) + '-' + d.slice(3, 5) + '-' + d.slice(5) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d);
  };
  tin.addEventListener('input', fmt);
  document.querySelectorAll('input[name=tintype]').forEach(r => r.addEventListener('change', fmt));
}
function w9Value(radioName) { const r = document.querySelector('input[name=' + radioName + ']:checked'); return r ? r.value : ''; }
function w9Form() {
  const val = (id) => { const el = $('#w9-' + id); return el ? el.value.trim() : ''; };
  return {
    name: val('name'), business_name: val('business_name'), classification: w9Value('cls'),
    llc_class: val('llc_class'), other_text: val('other_text'), foreign_partners: $('#w9-foreign').checked,
    exempt_payee: val('exempt_payee'), fatca_code: val('fatca_code'), address: val('address'),
    city_state_zip: val('city_state_zip'), account_numbers: val('account_numbers'),
    tin_type: w9Value('tintype'), tin: val('tin').replace(/\D/g, ''), backup_withholding: $('#w9-bw').checked
  };
}
function showW9Errors(fields) {
  document.querySelectorAll('#w9 .f').forEach(el => { el.classList.remove('bad'); const e = el.querySelector('.err'); if (e) e.textContent = ''; });
  let first = null;
  for (const [k, msg] of Object.entries(fields || {})) {
    const el = $('#f-' + k); if (!el) continue;
    el.classList.add('bad'); const e = el.querySelector('.err'); if (e) e.textContent = msg;
    if (!first) first = el;
  }
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function previewW9() {
  // Open the tab first, inside the click, or a popup blocker eats it once the fetch finishes.
  const w = window.open('', '_blank');
  try {
    const r = await fetch('/api/sign/form-preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, form: w9Form() }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'The preview could not be made');
    const url = URL.createObjectURL(await r.blob());
    if (w) w.location = url; else location.href = url;
  } catch (e) { if (w) w.close(); alert(e.message); }
}

function signBlock() {
  return `
  <div class="card">
    <label>Before you sign</label>
    <div class="consent">
      <input type="checkbox" id="consent" ${doc.signer.consented ? 'checked disabled' : ''} />
      <label for="consent" style="margin:0;color:var(--text)">
        I agree to sign this document electronically, and I understand my electronic signature is
        as binding as one on paper. I can ask for a paper copy instead at no cost by replying to the
        message that sent me this link.
      </label>
    </div>
  </div>

  <div class="card">
    <label>Your signature</label>
    ${doc.form ? '<div class="sub" style="margin-bottom:10px"><b>Under penalties of perjury</b>, by signing you certify the statements in Part II above.</div>' : ''}
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabDraw"  aria-selected="true"  onclick="setMode('drawn')">Draw it</button>
      <button class="tab" role="tab" id="tabType" aria-selected="false" onclick="setMode('typed')">Type it</button>
    </div>

    <div id="drawPane">
      <canvas id="pad" aria-label="Signature pad — draw your signature here"></canvas>
      <div class="row" style="margin-top:9px">
        <button class="btn" onclick="clearPad()"><i class="ti ti-eraser"></i> Clear</button>
        <span class="note" style="margin:0">Draw with a finger, stylus or mouse.</span>
      </div>
    </div>

    <div id="typePane" class="hidden">
      <label for="typedName">Type your full legal name</label>
      <input type="text" id="typedName" autocomplete="name" placeholder="${esc(doc.signer.name)}" oninput="onTyped()" />
      <div class="typed-preview" id="typedPreview" aria-live="polite"></div>
      <div class="note">Typing your name here and pressing Sign adopts it as your signature.</div>
    </div>

    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="signBtn" onclick="submit()" disabled>
        <i class="ti ti-writing-sign"></i> Sign this document</button>
      <button class="btn link" onclick="decline()">I do not want to sign this</button>
    </div>
    <div class="note" id="msg" role="status" aria-live="polite"></div>
    <div class="note">Signing records the time. If you allow it, this device's location is recorded on the certificate too. You can still sign if location is unavailable.</div>
  </div>`;
}

function setMode(m) {
  mode = m;
  $('#tabDraw').setAttribute('aria-selected', String(m === 'drawn'));
  $('#tabType').setAttribute('aria-selected', String(m === 'typed'));
  $('#drawPane').classList.toggle('hidden', m !== 'drawn');
  $('#typePane').classList.toggle('hidden', m !== 'typed');
  refreshButton();
}

function onTyped() {
  $('#typedPreview').textContent = $('#typedName').value;
  refreshButton();
}

function refreshButton() {
  const consented = doc.signer.consented || ($('#consent') && $('#consent').checked);
  const has = mode === 'drawn' ? strokes.length > 0 : ($('#typedName').value.trim().length >= 2);
  const btn = $('#signBtn');
  if (btn) btn.disabled = !(consented && has);
}

let pad, ctx2d, drawing = false, currentStroke = null;

function wireSigning() {
  const c = $('#consent');
  if (c && !c.disabled) c.addEventListener('change', refreshButton);

  pad = $('#pad');
  // Back the canvas at device resolution so a signature is not a blurry approximation of itself.
  const dpr = window.devicePixelRatio || 1;
  const rect = pad.getBoundingClientRect();
  pad.width = Math.round(rect.width * dpr);
  pad.height = Math.round(rect.height * dpr);
  ctx2d = pad.getContext('2d');
  ctx2d.scale(dpr, dpr);
  ctx2d.lineWidth = 2.2; ctx2d.lineCap = 'round'; ctx2d.lineJoin = 'round';
  ctx2d.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#111';

  const pos = (e) => {
    const r = pad.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = (e) => {
    e.preventDefault(); drawing = true;
    currentStroke = []; strokes.push(currentStroke);
    const p = pos(e); currentStroke.push(p);
    ctx2d.beginPath(); ctx2d.moveTo(p.x, p.y);
    // A tap with no movement must still leave a mark — dotting an i, or a full stop.
    ctx2d.lineTo(p.x, p.y); ctx2d.stroke();
    refreshButton();
  };
  const move = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e); currentStroke.push(p);
    ctx2d.lineTo(p.x, p.y); ctx2d.stroke();
  };
  const end = () => { drawing = false; currentStroke = null; };

  pad.addEventListener('pointerdown', start);
  pad.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  pad.addEventListener('touchstart', start, { passive: false });
  pad.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', end);
}

function clearPad() {
  strokes = [];
  ctx2d.clearRect(0, 0, pad.width, pad.height);
  refreshButton();
}

function locate() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve({ geo_status: 'unsupported' }); return; }
    let done = false;
    const finish = (v) => { if (done) return; done = true; resolve(v); };
    const timer = setTimeout(() => finish({ geo_status: 'timeout' }), 8000);
    navigator.geolocation.getCurrentPosition(
      (p) => { clearTimeout(timer); finish({ geo_status: 'captured', lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }); },
      (err) => { clearTimeout(timer); finish({ geo_status: err && err.code === 1 ? 'denied' : 'unavailable' }); },
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
    );
  });
}
function deviceTz() {
  const mins = -new Date().getTimezoneOffset();
  const sign = mins >= 0 ? '+' : '-';
  const abs = Math.abs(mins);
  return sign + String(Math.floor(abs / 60)).padStart(2, '0') + ':' + String(abs % 60).padStart(2, '0');
}

async function submit() {
  const btn = $('#signBtn');
  btn.disabled = true;
  $('#msg').textContent = 'Recording the time and location…';
  try {
    if (!doc.signer.consented) { await api('/api/sign/consent'); doc.signer.consented = true; }
    const geo = await locate();
    const body = Object.assign(
      mode === 'drawn' ? { kind: 'drawn', strokes } : { kind: 'typed', typed: $('#typedName').value.trim() },
      geo,
      { client_at: new Date().toISOString(), tz: deviceTz() }
    );
    if (doc.form) body.form = w9Form();
    let r;
    try { r = await api('/api/sign/submit', body); }
    catch (e) { if (e.fields) showW9Errors(e.fields); throw e; }
    $('#wrap').innerHTML = `<div class="card">
      <h1>${doc.form ? 'Thank you — your W-9 is signed' : 'Thank you — that is signed'}</h1>
      <p class="sub">${r.complete
        ? 'Everyone has now signed. A completed copy, with a certificate recording how it was signed, is available below.'
        : 'We are now waiting on ' + esc((r.waiting_for || []).join(', ')) + '. You will be sent the completed copy once everyone has signed.'}</p>
      <div class="row" style="margin-top:14px">
        <a class="btn primary" href="/api/sign/pdf?token=${encodeURIComponent(token)}" target="_blank" rel="noopener">
          <i class="ti ti-download"></i> Download your copy</a>
      </div>
      <p class="note">Save this for your records. If you lose it, ask us and we will send it again.</p>
    </div>`;
  } catch (e) {
    $('#msg').textContent = e.message;
    btn.disabled = false;
  }
}

async function decline() {
  const reason = prompt('If you would like, tell us why. This is recorded with the document.') ;
  if (reason === null) return;     // cancelled — not a decline
  try {
    await api('/api/sign/decline', { reason });
    $('#wrap').innerHTML = '<div class="card"><h1>You have declined</h1>' +
      '<p class="sub">We have recorded that you did not sign, and nobody else will be asked to sign it. ' +
      'If that was a mistake, reply to the message that brought you here.</p></div>';
  } catch (e) { alert(e.message); }
}

boot();
</script>
</body>
</html>
